[project]
name = "pokepapers"
version = "0.1.0"
description = ""
authors = [
    { name = "J.J. Trigueiros", email = "jjtrigueiros@gmail.com" },
]
requires-python = ">= 3.9"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.13",
    "beautifulsoup4>=4.13.3",
    "loguru>=0.7.3",
    "opencv-python>=4.11.0.86",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "pytest-mock>=3.14.0",
    "requests>=2.32.3",
    "typer>=0.15.2",
    "types-aiofiles>=24.1.0.20241221",
    "yarl>=1.18.3",
]

[tool.pytest.ini_options]
pythonpath = [
    "src", "src/pokepapers"
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest-asyncio>=0.25.3",
    "pytest-vcr>=1.0.2",
    "ruff>=0.9.10",
]

[project.scripts]
ppp = "pokepapers.cli.app:app"
